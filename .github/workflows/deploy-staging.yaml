name: Deploy to Staging

on:
  workflow_run:
    workflows: ["Build & Push Container Images"]
    branches: [develop]
    types: [completed]

permissions:
  contents: write

jobs:
  deploy-staging:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.event.workflow_run.head_sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Update staging image tags
        run: |
          cd k8s/staging
          SERVICES=(auth api-gateway orchestrator email webvoice stt tts rag)
          for svc in "${SERVICES[@]}"; do
            kustomize edit set image "voice-saas/${svc}=ghcr.io/${{ github.repository_owner }}/voice-saas/${svc}:${{ steps.sha.outputs.short }}"
          done

      - name: Commit updated tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/staging/kustomization.yaml
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(staging): update image tags to ${{ steps.sha.outputs.short }}"
          git push origin develop
