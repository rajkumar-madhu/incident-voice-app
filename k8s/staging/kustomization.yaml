---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: voice-saas-staging

namespace: voice-saas

# Base configuration
resources:
  - ../base

# Staging-specific labels
commonLabels:
  environment: staging

# Staging image tags
images:
  - name: voice-saas/auth
    newTag: staging
  - name: voice-saas/api-gateway
    newTag: staging
  - name: voice-saas/orchestrator
    newTag: staging
  - name: voice-saas/email
    newTag: staging
  - name: voice-saas/webvoice
    newTag: staging
  - name: voice-saas/rag
    newTag: staging
  - name: voice-saas/stt
    newTag: staging
  - name: voice-saas/tts
    newTag: staging

# Staging-specific patches
patches:
  # Reduce replica counts for staging
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: orchestrator
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: stt
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: tts
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  # Update HPA min replicas
  - target:
      kind: HorizontalPodAutoscaler
      name: api-gateway-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 5
  - target:
      kind: HorizontalPodAutoscaler
      name: stt-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2

  # Staging ingress hosts
  - target:
      kind: Ingress
      name: voice-saas-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: api-staging.voice-saas.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: api-staging.voice-saas.example.com
  - target:
      kind: Ingress
      name: voice-saas-webvoice-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: voice-staging.voice-saas.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: voice-staging.voice-saas.example.com
  - target:
      kind: Ingress
      name: voice-saas-flowise-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: flowise-staging.voice-saas.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: flowise-staging.voice-saas.example.com
  - target:
      kind: Ingress
      name: voice-saas-admin-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: admin-staging.voice-saas.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: admin-staging.voice-saas.example.com

  # Reduced resource quota for staging
  - target:
      kind: ResourceQuota
      name: voice-saas-quota
    patch: |-
      - op: replace
        path: /spec/hard/requests.cpu
        value: "10"
      - op: replace
        path: /spec/hard/requests.memory
        value: "20Gi"
      - op: replace
        path: /spec/hard/limits.cpu
        value: "20"
      - op: replace
        path: /spec/hard/limits.memory
        value: "40Gi"
      - op: replace
        path: /spec/hard/requests.nvidia.com~1gpu
        value: "2"

  # Use staging cert issuer
  - target:
      kind: Ingress
      name: voice-saas-ingress
    patch: |-
      - op: replace
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-staging
  - target:
      kind: Ingress
      name: voice-saas-webvoice-ingress
    patch: |-
      - op: replace
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-staging
  - target:
      kind: Ingress
      name: voice-saas-flowise-ingress
    patch: |-
      - op: replace
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-staging
  - target:
      kind: Ingress
      name: voice-saas-admin-ingress
    patch: |-
      - op: replace
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-staging

# ConfigMap patches for staging
configMapGenerator:
  - name: staging-config
    behavior: create
    literals:
      - ENVIRONMENT=staging
      - LOG_LEVEL=debug
