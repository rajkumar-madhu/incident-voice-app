---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: voice-saas
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: voice-saas-secrets
  namespace: voice-saas
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: voice-saas-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: voice-saas/production
        property: DATABASE_URL
    - secretKey: DATABASE_PASSWORD
      remoteRef:
        key: voice-saas/production
        property: DATABASE_PASSWORD
    - secretKey: REDIS_URL
      remoteRef:
        key: voice-saas/production
        property: REDIS_URL
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: voice-saas/production
        property: REDIS_PASSWORD
    - secretKey: JWT_SECRET
      remoteRef:
        key: voice-saas/production
        property: JWT_SECRET
    - secretKey: JWT_REFRESH_SECRET
      remoteRef:
        key: voice-saas/production
        property: JWT_REFRESH_SECRET
    - secretKey: EMAIL_ENCRYPTION_KEY
      remoteRef:
        key: voice-saas/production
        property: EMAIL_ENCRYPTION_KEY
    - secretKey: WEBHOOK_SECRET
      remoteRef:
        key: voice-saas/production
        property: WEBHOOK_SECRET
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: voice-saas/production
        property: ANTHROPIC_API_KEY
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: voice-saas/production
        property: OPENAI_API_KEY
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: voice-saas-data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: postgres-credentials
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: voice-saas/production
        property: DATABASE_PASSWORD
    - secretKey: DATABASE_URL
      remoteRef:
        key: voice-saas/production
        property: DATABASE_URL
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: flowise-credentials
  namespace: voice-saas
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: flowise-credentials
    creationPolicy: Owner
  data:
    - secretKey: FLOWISE_USERNAME
      remoteRef:
        key: voice-saas/production
        property: FLOWISE_USERNAME
    - secretKey: FLOWISE_PASSWORD
      remoteRef:
        key: voice-saas/production
        property: FLOWISE_PASSWORD
