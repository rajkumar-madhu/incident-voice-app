apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-static-fix
  namespace: voice-saas
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santhira Voice Agent</title>
    <style>
      :root {
        --bg: #0f1117;
        --surface: #1a1d27;
        --border: #2a2d3a;
        --text: #e4e4e7;
        --muted: #71717a;
        --accent: #6366f1;
        --accent-hover: #818cf8;
        --red: #ef4444;
        --green: #22c55e;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 16px 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      header h1 { font-size: 18px; font-weight: 600; }
      #status {
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 12px;
        background: var(--surface);
        color: var(--muted);
      }
      #status.connected { background: #052e16; color: var(--green); }
      #chat {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .msg {
        max-width: 75%;
        padding: 12px 16px;
        border-radius: 12px;
        line-height: 1.5;
        font-size: 14px;
        white-space: pre-wrap;
      }
      .msg.user {
        align-self: flex-end;
        background: var(--accent);
        color: #fff;
        border-bottom-right-radius: 4px;
      }
      .msg.assistant {
        align-self: flex-start;
        background: var(--surface);
        border: 1px solid var(--border);
        border-bottom-left-radius: 4px;
      }
      .msg .label {
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 4px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .msg.user .label { color: rgba(255,255,255,0.7); }
      .msg.processing {
        align-self: center;
        background: transparent;
        color: var(--muted);
        font-style: italic;
        border: none;
        padding: 8px;
      }
      #controls {
        padding: 20px 24px;
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: center;
        gap: 16px;
        align-items: center;
      }
      button {
        border: none;
        border-radius: 50%;
        width: 64px;
        height: 64px;
        cursor: pointer;
        font-size: 24px;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      button:disabled { opacity: 0.4; cursor: not-allowed; }
      #micBtn { background: var(--accent); color: #fff; }
      #micBtn:hover:not(:disabled) { background: var(--accent-hover); transform: scale(1.05); }
      #micBtn.recording { background: var(--red); animation: pulse 1.5s infinite; }
      #stopBtn {
        background: var(--surface);
        border: 2px solid var(--border);
        color: var(--text);
        width: 48px;
        height: 48px;
        font-size: 18px;
      }
      #stopBtn:hover:not(:disabled) { border-color: var(--red); color: var(--red); }
      @keyframes pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); }
        50% { box-shadow: 0 0 0 12px rgba(239,68,68,0); }
      }
      #chat::-webkit-scrollbar { width: 6px; }
      #chat::-webkit-scrollbar-track { background: transparent; }
      #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    </style>
    </head>
    <body>
    <header>
      <h1>Santhira Voice Agent</h1>
      <span id="status">Disconnected</span>
    </header>
    <div id="chat">
      <div class="msg assistant">
        <div class="label">Santhira</div>
        Hello! I'm Santhira, your IT incident management assistant. Click the microphone to start speaking.
      </div>
    </div>
    <div id="controls">
      <button id="stopBtn" disabled title="Stop recording">&#9724;</button>
      <button id="micBtn" disabled title="Start recording">&#127908;</button>
    </div>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
    (function() {
      const chat   = document.getElementById('chat');
      const micBtn = document.getElementById('micBtn');
      const stopBtn = document.getElementById('stopBtn');
      const statusEl = document.getElementById('status');

      let socket = null;
      let mediaRecorder = null;
      let recording = false;
      let audioCtx = null;

      // Unlock AudioContext on first user interaction
      function ensureAudioContext() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      // Socket.IO
      socket = io({ transports: ['websocket'] });

      socket.on('connect', () => {
        statusEl.textContent = 'Connected';
        statusEl.className = 'connected';
        micBtn.disabled = false;
        socket.emit('start-session', {});
      });

      socket.on('disconnect', () => {
        statusEl.textContent = 'Disconnected';
        statusEl.className = '';
        micBtn.disabled = true;
      });

      socket.on('session-ready', (data) => {
        console.log('Session:', data.session_id);
      });

      socket.on('transcript', (data) => {
        removeProcessing();
        addMessage('user', data.text);
        addProcessing('Thinking...');
      });

      socket.on('response-text', (data) => {
        removeProcessing();
        addMessage('assistant', data.text);
      });

      socket.on('audio-response', (data) => {
        enqueueAudio(data.audio);
      });

      socket.on('audio-done', () => {});

      socket.on('error', (data) => {
        removeProcessing();
        if (data.code !== 'AUDIO_TOO_SHORT') {
          addMessage('assistant', 'Error: ' + data.message);
        }
      });

      // Audio Recording
      micBtn.addEventListener('click', startRecording);
      stopBtn.addEventListener('click', stopRecording);

      async function startRecording() {
        ensureAudioContext();
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream, { mimeType: getMimeType() });
          mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) socket.emit('audio-chunk', e.data);
          };
          mediaRecorder.onstop = () => {
            stream.getTracks().forEach(t => t.stop());
            socket.emit('finalize-audio', {});
            addProcessing('Transcribing...');
          };
          mediaRecorder.start(250);
          recording = true;
          micBtn.classList.add('recording');
          micBtn.disabled = true;
          stopBtn.disabled = false;
        } catch (err) {
          addMessage('assistant', 'Microphone access denied. Please allow microphone permissions.');
        }
      }

      function stopRecording() {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        recording = false;
        micBtn.classList.remove('recording');
        micBtn.disabled = false;
        stopBtn.disabled = true;
      }

      function getMimeType() {
        if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) return 'audio/webm;codecs=opus';
        if (MediaRecorder.isTypeSupported('audio/webm')) return 'audio/webm';
        return '';
      }

      // Audio Playback — decode via AudioContext to avoid autoplay issues
      const audioQueue = [];
      let isPlaying = false;

      function enqueueAudio(base64mp3) {
        audioQueue.push(base64mp3);
        if (!isPlaying) playNext();
      }

      async function playNext() {
        if (audioQueue.length === 0) { isPlaying = false; return; }
        isPlaying = true;
        const base64mp3 = audioQueue.shift();
        try {
          const ctx = ensureAudioContext();
          const raw = atob(base64mp3);
          const buf = new Uint8Array(raw.length);
          for (let i = 0; i < raw.length; i++) buf[i] = raw.charCodeAt(i);
          const audioBuf = await ctx.decodeAudioData(buf.buffer);
          const source = ctx.createBufferSource();
          source.buffer = audioBuf;
          source.connect(ctx.destination);
          source.onended = () => playNext();
          source.start(0);
        } catch (err) {
          console.error('Audio playback error:', err);
          playNext();
        }
      }

      // Chat UI
      function addMessage(role, text) {
        const div = document.createElement('div');
        div.className = 'msg ' + role;
        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = role === 'user' ? 'You' : 'Santhira';
        div.appendChild(label);
        div.appendChild(document.createTextNode(text));
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
      }

      function addProcessing(text) {
        const div = document.createElement('div');
        div.className = 'msg processing';
        div.id = 'processing';
        div.textContent = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
      }

      function removeProcessing() {
        const el = document.getElementById('processing');
        if (el) el.remove();
      }
    })();
    </script>
    </body>
    </html>
