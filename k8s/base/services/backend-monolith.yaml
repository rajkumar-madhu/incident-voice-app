apiVersion: v1
kind: Service
metadata:
  name: backend-monolith
  namespace: voice-saas
  labels:
    app: backend-monolith
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP
      name: api-gateway
    - port: 8001
      targetPort: 8001
      protocol: TCP
      name: stt
    - port: 8002
      targetPort: 8002
      protocol: TCP
      name: tts
    - port: 8003
      targetPort: 8003
      protocol: TCP
      name: rag
  selector:
    app: backend-monolith
