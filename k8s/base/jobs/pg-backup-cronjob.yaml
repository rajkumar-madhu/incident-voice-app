apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
  namespace: voice-saas-data
spec:
  schedule: "0 2 * * *"  # Daily at 02:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: pg-backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 1001
            runAsNonRoot: true
          containers:
            - name: backup
              image: postgres:16-alpine
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  BACKUP_FILE="/backups/voice-saas-${TIMESTAMP}.sql.gz"

                  echo "Starting PostgreSQL backup at ${TIMESTAMP}..."

                  # Full database dump with compression
                  pg_dump "$DATABASE_URL" \
                    --format=custom \
                    --compress=9 \
                    --verbose \
                    --file="${BACKUP_FILE}"

                  BACKUP_SIZE=$(du -h "${BACKUP_FILE}" | cut -f1)
                  echo "Backup completed: ${BACKUP_FILE} (${BACKUP_SIZE})"

                  # Upload to S3 (if AWS CLI available)
                  if command -v aws &> /dev/null; then
                    aws s3 cp "${BACKUP_FILE}" \
                      "s3://${BACKUP_S3_BUCKET}/pg-backups/voice-saas-${TIMESTAMP}.sql.gz" \
                      --storage-class STANDARD_IA
                    echo "Uploaded to S3: s3://${BACKUP_S3_BUCKET}/pg-backups/"
                  fi

                  # Clean up local backups older than 30 days
                  find /backups -name "*.sql.gz" -mtime +30 -delete
                  echo "Cleaned up backups older than 30 days."
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: DATABASE_URL
                - name: BACKUP_S3_BUCKET
                  value: "linkedeye-voice-saas-backups"
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: pg-backup-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-backup-pvc
  namespace: voice-saas-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
