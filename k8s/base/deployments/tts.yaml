---
# TTS (Piper fallback) Service Deployment - CPU Mode
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tts
  namespace: voice-saas
  labels:
    app.kubernetes.io/name: tts
    app.kubernetes.io/component: ml
    app.kubernetes.io/part-of: voice-saas
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tts
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tts
        app.kubernetes.io/component: ml
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: voice-saas-ml
      containers:
        - name: tts
          image: voice-saas/tts:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8002
              protocol: TCP
          envFrom:
            - configMapRef:
                name: voice-saas-config
            - secretRef:
                name: voice-saas-secrets
          env:
            - name: TTS_INDICF5_ENABLED
              value: "false"
            - name: TTS_INDICF5_DEVICE
              value: "cpu"
            - name: TTS_PIPER_ENABLED
              value: "true"
            - name: PORT
              value: "8002"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
---
# TTS Service
apiVersion: v1
kind: Service
metadata:
  name: tts-svc
  namespace: voice-saas
  labels:
    app.kubernetes.io/name: tts
    app.kubernetes.io/component: service
spec:
  type: ClusterIP
  ports:
    - port: 8002
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: tts
---
# TTS HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tts-hpa
  namespace: voice-saas
  labels:
    app.kubernetes.io/name: tts
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tts
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
