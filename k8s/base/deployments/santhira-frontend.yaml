apiVersion: apps/v1
kind: Deployment
metadata:
  name: santhira-frontend
  namespace: voice-saas
  labels:
    app: santhira-frontend
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: santhira-frontend
  template:
    metadata:
      labels:
        app: santhira-frontend
        tier: frontend
    spec:
      serviceAccountName: voice-saas-sa
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: santhira-frontend
          image: voice-saas/santhira-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: santhira-frontend-config
            - secretRef:
                name: voice-saas-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
