---
# STT (Whisper) Service Deployment - CPU Mode
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stt
  namespace: voice-saas
  labels:
    app.kubernetes.io/name: stt
    app.kubernetes.io/component: ml
    app.kubernetes.io/part-of: voice-saas
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stt
        app.kubernetes.io/component: ml
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: voice-saas-ml
      containers:
        - name: stt
          image: voice-saas/stt:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: voice-saas-config
            - secretRef:
                name: voice-saas-secrets
          env:
            - name: STT_WHISPER_DEVICE
              value: "cpu"
            - name: STT_WHISPER_COMPUTE_TYPE
              value: "int8"
            - name: STT_WHISPER_MODEL
              value: "base"
            - name: PORT
              value: "8001"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: whisper-cache
              mountPath: /root/.cache/huggingface
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: whisper-cache
          persistentVolumeClaim:
            claimName: whisper-cache-pvc
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
---
# STT Service
apiVersion: v1
kind: Service
metadata:
  name: stt-svc
  namespace: voice-saas
  labels:
    app.kubernetes.io/name: stt
    app.kubernetes.io/component: service
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: stt
---
# STT HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stt-hpa
  namespace: voice-saas
  labels:
    app.kubernetes.io/name: stt
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stt
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# Whisper Cache PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: whisper-cache-pvc
  namespace: voice-saas
  labels:
    app.kubernetes.io/name: stt
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: do-block-storage
  resources:
    requests:
      storage: 10Gi
