---
# RAG Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag
  namespace: voice-saas
  labels:
    app.kubernetes.io/name: rag
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: voice-saas
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rag
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8003"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: voice-saas-ml
      imagePullSecrets:
        - name: registry-santhira-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: rag
          image: voice-saas/rag:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8003
              protocol: TCP
          envFrom:
            - configMapRef:
                name: voice-saas-config
          env:
            - name: RAG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: voice-saas-secrets
                  key: DATABASE_URL
            - name: RAG_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: voice-saas-secrets
                  key: REDIS_URL
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: embedding-cache
              mountPath: /home/appuser/.cache/huggingface
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: embedding-cache
          persistentVolumeClaim:
            claimName: embedding-cache-pvc
---
# RAG Service
apiVersion: v1
kind: Service
metadata:
  name: rag
  namespace: voice-saas
  labels:
    app.kubernetes.io/name: rag
    app.kubernetes.io/component: service
spec:
  type: ClusterIP
  ports:
    - port: 8003
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: rag
---
# RAG HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rag-hpa
  namespace: voice-saas
  labels:
    app.kubernetes.io/name: rag
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rag
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# Embedding Cache PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: embedding-cache-pvc
  namespace: voice-saas
  labels:
    app.kubernetes.io/name: rag
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: do-block-storage
  resources:
    requests:
      storage: 5Gi
