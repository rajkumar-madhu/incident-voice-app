# API routes → gateway (with /api prefix stripping)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voice-saas-admin-api-ingress
  namespace: voice-saas
  annotations:
    kubernetes.io/ingress.class: nginx
    # TLS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Rewrite: strip /api prefix so /api/auth/login → /auth/login
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    # Rate limiting (stricter for admin)
    nginx.ingress.kubernetes.io/limit-rps: "30"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    nginx.ingress.kubernetes.io/limit-connections: "10"
    # Request size
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - admin.santhira.com
      secretName: voice-saas-admin-tls
  rules:
    - host: admin.santhira.com
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend-monolith
                port:
                  number: 4000
---
# Static frontend → dashboard (no rewrite)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voice-saas-admin-ingress
  namespace: voice-saas
  annotations:
    kubernetes.io/ingress.class: nginx
    # TLS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Rate limiting (stricter for admin)
    nginx.ingress.kubernetes.io/limit-rps: "30"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    nginx.ingress.kubernetes.io/limit-connections: "10"
    # Request size
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - admin.santhira.com
      secretName: voice-saas-admin-tls
  rules:
    - host: admin.santhira.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  number: 5173
