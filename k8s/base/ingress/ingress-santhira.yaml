apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: santhira-frontend-ingress
  namespace: voice-saas
  annotations:
    kubernetes.io/ingress.class: nginx
    # TLS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Sticky sessions for Socket.IO
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "VOICESESSION"
    nginx.ingress.kubernetes.io/session-cookie-expires: "1800"
    nginx.ingress.kubernetes.io/session-cookie-secure: "true"
    nginx.ingress.kubernetes.io/session-cookie-samesite: "None"
    # WebSocket timeouts (1 hour for long voice sessions)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Request size
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - voice.santhira.com
      secretName: santhira-frontend-tls
  rules:
    - host: voice.santhira.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: santhira-frontend
                port:
                  number: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: santhira-backend-ingress
  namespace: voice-saas
  annotations:
    kubernetes.io/ingress.class: nginx
    # TLS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Request size (audio uploads)
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # Extended timeouts for AI processing
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - voice.api.santhira.com
      secretName: santhira-backend-tls
  rules:
    - host: voice.api.santhira.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-monolith
                port:
                  number: 4000
