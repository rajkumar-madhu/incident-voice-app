apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voice-saas-flowise-ingress
  namespace: voice-saas
  annotations:
    kubernetes.io/ingress.class: nginx
    # TLS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # IP whitelist for admin dashboard — replace with actual office/VPN IPs
    nginx.ingress.kubernetes.io/whitelist-source-range: "0.0.0.0/0"
    # Basic auth (uncomment after creating flowise-basic-auth secret)
    # nginx.ingress.kubernetes.io/auth-type: basic
    # nginx.ingress.kubernetes.io/auth-secret: flowise-basic-auth
    # Security (snippets disabled on cluster)
    # Request size
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - flowise.santhira.com
      secretName: voice-saas-flowise-tls
  rules:
    - host: flowise.santhira.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flowise
                port:
                  number: 3000
