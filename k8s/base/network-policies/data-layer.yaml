---
# Deny all ingress to data namespace by default
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-default-deny
  namespace: voice-saas-data
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow only voice-saas namespace pods to access PostgreSQL
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-from-voice-saas
  namespace: voice-saas-data
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: voice-saas
      ports:
        - protocol: TCP
          port: 5432
---
# Allow only voice-saas namespace pods to access Redis
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-from-voice-saas
  namespace: voice-saas-data
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: voice-saas
      ports:
        - protocol: TCP
          port: 6379
---
# Allow Prometheus to scrape data layer metrics
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape-data
  namespace: voice-saas-data
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9187  # postgres-exporter
        - protocol: TCP
          port: 9121  # redis-exporter
