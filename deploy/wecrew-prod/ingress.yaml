apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboard
  namespace: voice-app
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["ai.voice.wecrew.in"]
      secretName: ai-voice-wecrew-tls
  rules:
    - host: ai.voice.wecrew.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  number: 5173
---
# The gateway serves routes without the /api prefix the dashboard uses.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: voice-app
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["ai.voice.wecrew.in"]
      secretName: ai-voice-wecrew-tls
  rules:
    - host: ai.voice.wecrew.in
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: api-gateway
                port:
                  number: 4000
