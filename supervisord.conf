[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/var/log/supervisor
loglevel=info

; ─── Auth Service (priority 10 - starts first) ───
[program:auth]
command=node /app/services/auth/dist/index.js
directory=/app/services/auth
autostart=true
autorestart=true
startsecs=10
startretries=3
priority=10
stdout_logfile=/var/log/supervisor/auth-stdout.log
stderr_logfile=/var/log/supervisor/auth-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
environment=NODE_ENV="production"

; ─── API Gateway (priority 20 - starts after auth) ───
[program:api-gateway]
command=node /app/services/api-gateway/dist/index.js
directory=/app/services/api-gateway
autostart=true
autorestart=true
startsecs=10
startretries=3
priority=20
stdout_logfile=/var/log/supervisor/api-gateway-stdout.log
stderr_logfile=/var/log/supervisor/api-gateway-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
environment=NODE_ENV="production"

; ─── STT Service (priority 30) ───
[program:stt]
command=python3 -m uvicorn main:app --host 0.0.0.0 --port 8001
directory=/app/services/stt
autostart=true
autorestart=true
startsecs=10
startretries=3
priority=30
stdout_logfile=/var/log/supervisor/stt-stdout.log
stderr_logfile=/var/log/supervisor/stt-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

